plugins {
  id "com.android.application"
}

// Release signing comes from android/keystore.properties (not in git). Without it, only debug builds work.
def keystoreProps = new Properties()
def keystoreFile = rootProject.file("keystore.properties")
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }

android {
  namespace "uz.gulicosmetics.pos"
  compileSdk 36

  defaultConfig {
    applicationId "uz.gulicosmetics.pos"
    minSdk 26
    targetSdk 36
    versionCode 3
    versionName "1.2.0"
    // The live POS this app opens. Change it here and rebuild to point at another address.
    buildConfigField "String", "APP_URL", '"https://guli-cosmetics-pos.vercel.app/mobil"'
  }

  buildFeatures {
    buildConfig true
  }

  signingConfigs {
    release {
      if (keystoreFile.exists()) {
        storeFile rootProject.file(keystoreProps["storeFile"])
        storePassword keystoreProps["storePassword"]
        keyAlias keystoreProps["keyAlias"]
        keyPassword keystoreProps["keyPassword"]
      }
    }
  }

  buildTypes {
    release {
      minifyEnabled false
      if (keystoreFile.exists()) signingConfig signingConfigs.release
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation "androidx.core:core:1.17.0"
}
